
server:
  port: 8082

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true


spring:
  cloud:
    config:
      fail-fast: true
      retry:
       max-attempts: 3


  datasource:
    url: "jdbc:postgresql://pg-user-service-db-trialproject1.k.aivencloud.com"
    username: "avnadmin"
    password:
    driver-class-name: "org.postgresql.Driver"

  jpa:
    hibernate:
      ddl-auto: update
    ##   show-sql: true
    properties:
      hibernate:
        format_sql: true

    database-platform: org.hibernate.dialect.PostgreSQLDialect

jwt:
  secret:
    key:





